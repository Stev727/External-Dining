<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高管就餐确认</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f4f6f9; color: #2b3445; font-size: 15px; }
  .box { max-width: 420px; margin: 60px auto; background: #fff; border-radius: 14px; padding: 30px 26px; box-shadow: 0 2px 12px rgba(30,50,80,.08); }
  h2 { font-size: 19px; margin-bottom: 6px; }
  .sub { color: #7a8598; font-size: 13.5px; margin-bottom: 18px; }
  .info { background: #f7f9fc; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; font-size: 14px; line-height: 2; }
  .info b { color: #185fa5; }
  .meal-block { border: 1px solid #e6ebf3; border-radius: 12px; padding: 16px 14px; margin-bottom: 14px; }
  .meal-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .meal-title b { font-size: 15.5px; }
  .meal-title .st { font-size: 13px; color: #999; }
  .meal-title .st.yes { color: #0f6e56; font-weight: 600; }
  .meal-title .st.no { color: #b23a3a; font-weight: 600; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
  .row label { width: 52px; color: #666; font-size: 13.5px; }
  input { flex: 1; padding: 9px 12px; border: 1px solid #dfe5ee; border-radius: 8px; font-size: 14px; }
  .btns { display: flex; gap: 12px; }
  button { flex: 1; padding: 12px 0; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .yes { background: #0f6e56; color: #fff; }
  .no { background: #b23a3a; color: #fff; }
  .cancel-solid { background: #b23a3a; color: #fff; }
  .limit-tip { background: #fdf3f3; border: 1px solid #e8c8c8; border-radius: 10px; padding: 10px 12px; color: #a32d2d; font-size: 13px; text-align: center; }
  .result { text-align: center; padding: 20px 0; font-size: 16px; font-weight: 600; }
  .result.ok { color: #0f6e56; }
  .result.err { color: #a32d2d; }
  .tip { margin-top: 14px; color: #999; font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<div class="box" id="app">
  <h2>高管就餐确认</h2>
  <div class="sub" id="sub">加载中...</div>
  <div id="content"></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const E = qs.get('e'), D = qs.get('d'), T = qs.get('t');
const MEAL = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐' };

async function load() {
  const r = await fetch(`/api/exec/page-data?e=${E}&d=${D}&t=${T}`).then(r => r.json());
  if (r.code !== 0) { document.getElementById('sub').textContent = ''; renderMsg(r.msg || '链接无效', true); return; }
  const d = r.data;
  const week = ['日','一','二','三','四','五','六'][new Date(D + 'T00:00:00+08:00').getDay()];
  document.getElementById('sub').textContent = `${d.name}${d.dept ? ' · ' + d.dept : ''}`;
  const blocks = d.meals.map(m => {
    const st = { pending: '尚未确认', yes: '已确认就餐', no: '已确认不就餐' }[m.status];
    const stCls = { pending: '', yes: 'yes', no: 'no' }[m.status];
    let body;
    if (m.status === 'pending') {
      body = `<div class="row"><label>人数：</label><input id="hc_${m.meal_type}" type="number" min="1" max="99" value="${m.headcount}"></div>
        <div class="btns">
          <button class="yes" onclick="send('yes','${m.meal_type}')">确认就餐</button>
          <button class="no" onclick="send('no','${m.meal_type}')">不就餐</button>
        </div>`;
    } else if (m.status === 'yes') {
      body = m.can_cancel
        ? `<div class="row"><label>人数：</label><input id="hc_${m.meal_type}" type="number" min="1" max="99" value="${m.headcount}"></div>
           <div class="btns"><button class="cancel-solid" onclick="send('cancel','${m.meal_type}')">取消就餐（${m.cancel_deadline} 前可取消）</button></div>`
        : `<div class="limit-tip">已超过取消截止时间（${m.cancel_deadline}），如需变更请联系管理员</div>`;
    } else {
      body = `<div class="btns"><button class="yes" onclick="send('yes','${m.meal_type}')">确认就餐</button></div>`;
    }
    return `<div class="meal-block">
      <div class="meal-title"><b>${m.meal_name}</b><span class="st ${stCls}">${st}</span></div>
      ${body}
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="info">
      就餐日期：<b>${D}（周${week}）</b><br>
      地点：<b>${d.place_name}</b> ｜ 封账时间：${d.deadline}
    </div>
    ${blocks}
    <div class="tip">各餐别独立确认，结果自动计入就餐统计。</div>`;
}

async function send(status, meal) {
  const hcEl = document.getElementById('hc_' + meal);
  const hc = hcEl ? (+hcEl.value || 1) : 1;
  const r = await fetch('/api/exec/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ e: E, d: D, t: T, status, meal, headcount: hc }) }).then(r => r.json());
  renderMsg(r.msg || (r.code === 0 ? '已提交' : '提交失败'), r.code !== 0, true);
  if (r.code === 0) setTimeout(load, 1200);
}

function renderMsg(text, isErr, keepSub) {
  if (!keepSub) document.getElementById('sub').textContent = '';
  document.getElementById('content').innerHTML = `<div class="result ${isErr ? 'err' : 'ok'}">${text}</div>`;
}

load();
</script>
</body>
</html>
